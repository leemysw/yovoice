name: Check and Package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # 每周全量跑一次浏览器测试，包括日常提交不跑的已封存用例。
  schedule:
    - cron: '0 3 * * 1'
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      tag:
        type: string
        default: ""
permissions:
  contents: read
env:
  PYTHONUTF8: "1"
concurrency:
  # PR 按编号分组：fork 里同名分支（如 main）的 PR 不会取消主仓库 main 的运行，同名分支的不同 PR 也互不取消。
  group: build-${{ github.workflow }}-${{ inputs.tag || (github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)) || github.ref }}
  cancel-in-progress: ${{ !inputs.release }}
jobs:
  # 日常提交只跑测试；Windows/macOS 验证平台相关的 Go 行为与 macOS 更新器，打包只在发布标签时运行。
  test:
    if: ${{ !inputs.release && github.event_name != 'schedule' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check release notes extraction
        if: runner.os == 'macOS'
        run: python3 scripts/test-release-notes.py
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # 竞态检测只在 Linux 上跑；这里只验证平台相关行为，不重复加 -race。
      - run: go test ./...
      - run: python3 scripts/desktop/check-signing.py
        if: runner.os == 'macOS'
      - name: Verify macOS updater
        if: runner.os == 'macOS'
        run: |
          swift test --package-path desktop/macos
          python3 scripts/desktop/check-macos-update.py
  package:
    if: ${{ inputs.release }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows-x64
          - runner: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: 8.0.x
      - name: Set application version
        shell: bash
        env:
          RELEASE: ${{ inputs.release }}
          TAG: ${{ inputs.tag }}
        run: |
          if [[ "$RELEASE" == true ]]; then
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then echo '无效的版本标签' >&2; exit 1; fi
            echo "YOVOICE_VERSION=${TAG#v}" >> "$GITHUB_ENV"
          fi
          echo "YOVOICE_BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - run: pnpm --dir web install --frozen-lockfile
      - name: Cache audio.cpp runtime
        uses: actions/cache@v4
        with:
          path: |
            artifacts/downloads/audio-*.zip
            artifacts/downloads/audio-*.tar.gz
          key: audio-cpp-${{ matrix.platform }}-${{ hashFiles('internal/catalog/engine.json', 'scripts/desktop/build-windows.ps1', 'scripts/desktop/build-macos.sh') }}
      - name: Cache ocho runtime
        uses: actions/cache@v4
        with:
          path: artifacts/downloads/ocho-*
          key: ocho-${{ matrix.platform }}-${{ hashFiles('internal/catalog/ocho.json', 'scripts/package-ocho.py') }}
      - uses: actions/cache@v4
        with:
          path: |
            artifacts/ffmpeg/
            artifacts/downloads/ffmpeg-*.tar.xz
          key: ffmpeg-${{ matrix.platform }}-${{ hashFiles('scripts/build-ffmpeg.py') }}
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          install: make curl diffutils mingw-w64-x86_64-gcc mingw-w64-x86_64-python
      - name: Build Windows audio converter
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: python scripts/build-ffmpeg.py
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 安装失败" }
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # 仅正式发布签名；未配置证书时脚本跳过签名。
          WINDOWS_SIGN_PFX_BASE64: ${{ inputs.release && secrets.WINDOWS_SIGN_PFX_BASE64 || '' }}
          WINDOWS_SIGN_PASSWORD: ${{ inputs.release && secrets.WINDOWS_SIGN_PASSWORD || '' }}
        run: ./scripts/desktop/build-windows.ps1 -Package -Cuda
      - name: Verify Windows service errors and recovery
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet run --project desktop/windows/ServiceChecks
          if ($LASTEXITCODE -ne 0) { throw "保存与错误协议检查失败" }
      - name: Verify Windows updater
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          dotnet run --project desktop/windows/UpdateChecks
          if ($LASTEXITCODE -ne 0) { throw "更新元数据检查失败" }
          ./scripts/desktop/check-windows-update.ps1
      - name: Verify Windows Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/desktop/check-windows-setup.ps1
      - name: Import macOS signing certificate
        if: inputs.release && runner.os == 'macOS'
        env:
          MACOS_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
        run: |
          : "${MACOS_DEVELOPER_ID_CERTIFICATE_BASE64:?缺少签名证书}"
          : "${MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD:?缺少证书密码}"
          cert_path="$RUNNER_TEMP/yovoice-developer-id.p12"
          keychain_path="$RUNNER_TEMP/yovoice-signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "::add-mask::$keychain_password"
          echo "MACOS_CODESIGN_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          trap 'rm -f "$cert_path"' EXIT
          printf '%s' "$MACOS_DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > "$cert_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" -k "$keychain_path" -P "$MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" "$HOME/Library/Keychains/login.keychain-db"
          # 从已导入证书解析签名名称，并核对开发者团队，避免手填名称不一致。
          python3 - <<'PY'
          import os, re, subprocess
          identities = subprocess.check_output(['security', 'find-identity', '-v', '-p', 'codesigning', os.environ['RUNNER_TEMP'] + '/yovoice-signing.keychain-db'], text=True)
          matches = [name for name in re.findall(r'"(Developer ID Application: [^"\n]+)"', identities) if name.endswith('(' + os.environ['APPLE_NOTARY_TEAM_ID'] + ')')]
          if len(matches) != 1:
              raise SystemExit('导入的证书中必须有且仅有一个属于公证团队的有效 Developer ID Application 身份')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('YOVOICE_RELEASE_IDENTITY=' + matches[0] + '\n')
          PY
      - name: Package standalone CLI
        env:
          YOVOICE_CODESIGN_IDENTITY: ${{ inputs.release && env.YOVOICE_RELEASE_IDENTITY || '-' }}
          YOVOICE_NOTARIZE: ${{ inputs.release && '1' || '0' }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: python3 scripts/package-cli.py
      - name: Package macOS
        if: runner.os == 'macOS'
        env:
          YOVOICE_CODESIGN_IDENTITY: ${{ inputs.release && env.YOVOICE_RELEASE_IDENTITY || '-' }}
          YOVOICE_NOTARIZE: ${{ inputs.release && '1' || '0' }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: make app-package CONFIGURATION=release
      - name: Verify packaged audio conversion
        if: runner.os == 'macOS'
        run: |
          command -v ffmpeg >/dev/null || brew install ffmpeg
          YOVOICE_TEST_FFMPEG="$PWD/artifacts/macos-arm64/yovoice.app/Contents/Resources/tools/ffmpeg" go test -race ./internal/audio -run '^(TestAudioConversion|TestEncode)$' -count=1
      - name: Delete macOS signing keychain
        if: always() && runner.os == 'macOS' && env.MACOS_CODESIGN_KEYCHAIN_PATH != ''
        run: security delete-keychain "$MACOS_CODESIGN_KEYCHAIN_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: yovoice-${{ matrix.platform }}
          path: |
            artifacts/yovoice-cli-${{ matrix.platform }}.zip
            artifacts/yovoice-macos-arm64.zip
            artifacts/yovoice-macos-arm64.dmg
            artifacts/yovoice-windows-x64-setup.exe
            artifacts/yovoice-windows-x64-update.exe
            artifacts/yovoice-windows-x64-cuda*.exe
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: yovoice-ffmpeg-source
          path: artifacts/yovoice-ffmpeg-source.tar.gz
          if-no-files-found: error

  # 前端检查与浏览器测试与平台无关，单独在 Linux 上并行跑，不拖慢打包任务。
  web:
    if: ${{ !inputs.release }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: pnpm --dir web run lint
      - run: pnpm --dir web test
        env:
          # 定时与手动触发时全量运行，包括已封存的用例。
          PW_ALL: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: web/test-results/
          retention-days: 7
  # Linux 上做格式、vet 与竞态检测。
  go:
    if: ${{ !inputs.release && github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check Go format and vet
        run: |
          unformatted="$(gofmt -l cmd internal desktop/linux)"
          if [[ -n "$unformatted" ]]; then echo "未格式化：$unformatted" >&2; exit 1; fi
          go vet ./...
          GOOS=windows go vet ./...
          GOOS=darwin go vet ./...
          go -C desktop/linux vet ./...
      - run: go test -race ./...
  # Linux 桌面应用：在 Xvfb 中启动真实的 WebKitGTK 窗口，验证桥接、音频、草稿保存与退出。
  linux-desktop:
    if: ${{ !inputs.release && github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install WebKitGTK and Xvfb
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 xvfb xauth gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - run: pnpm --dir web install --frozen-lockfile
      - name: Cache audio.cpp runtime
        uses: actions/cache@v4
        with:
          path: artifacts/downloads/audio-*.tar.gz
          key: audio-cpp-linux-x64-${{ hashFiles('internal/catalog/engine.json', 'scripts/desktop/build-linux.sh') }}
      - name: Cache ocho runtime
        uses: actions/cache@v4
        with:
          path: artifacts/downloads/ocho-*
          key: ocho-linux-x64-${{ hashFiles('internal/catalog/ocho.json', 'scripts/package-ocho.py') }}
      - uses: actions/cache@v4
        with:
          path: |
            artifacts/ffmpeg/
            artifacts/downloads/ffmpeg-*.tar.xz
          key: ffmpeg-linux-x64-${{ hashFiles('scripts/build-ffmpeg.py') }}
      - run: scripts/desktop/build-linux.sh
      - run: scripts/desktop/smoke-linux.sh
  linux:
    if: ${{ inputs.release }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install WebKitGTK and Xvfb
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 xvfb xauth gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - run: pnpm --dir web install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: |
            artifacts/ffmpeg/
            artifacts/downloads/ffmpeg-*.tar.xz
          key: ffmpeg-linux-x64-${{ hashFiles('scripts/build-ffmpeg.py') }}
      - name: Cache ocho runtime
        uses: actions/cache@v4
        with:
          path: artifacts/downloads/ocho-*
          key: ocho-linux-x64-${{ hashFiles('internal/catalog/ocho.json', 'scripts/package-ocho.py') }}
      - name: Package Linux CLI
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ -n "$TAG" ]]; then export YOVOICE_VERSION="${TAG#v}"; fi
          python3 scripts/package-cli.py
      - name: Verify Linux runtime
        run: |
          unzip artifacts/yovoice-cli-linux-x64.zip -d "$RUNNER_TEMP/cli"
          "$RUNNER_TEMP/cli/yovoice" --version
          "$RUNNER_TEMP/cli/yovoice" setup --data-dir "$RUNNER_TEMP/yovoice-data"
          engine=$(find "$RUNNER_TEMP/yovoice-data/runtime" -type f -name audiocpp_server)
          "$engine" --help
      - uses: actions/upload-artifact@v4
        with:
          name: yovoice-cli-linux-x64
          path: artifacts/yovoice-cli-linux-x64.zip
          if-no-files-found: error
      - name: Package Linux desktop
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ -n "$TAG" ]]; then export YOVOICE_VERSION="${TAG#v}"; fi
          YOVOICE_PACKAGE=1 scripts/desktop/build-linux.sh
          scripts/desktop/smoke-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: yovoice-linux-x64
          path: |
            artifacts/yovoice-linux-x64.tar.gz
            artifacts/yovoice-linux-x64.deb
          if-no-files-found: error
          retention-days: 14
